[workspace]
resolver = "2"
members = ["apple-codesign-quick"]

[workspace.dependencies]

plist = "1"
reqwest = { version = "0.13", features = ["rustls", "query", "gzip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

aes = "0.9.1"
aes-gcm = "0.11.0-rc.4"
cbc = { version = "0.2.0-rc.3", features = ["alloc"] }
hmac = "0.13.0"
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"